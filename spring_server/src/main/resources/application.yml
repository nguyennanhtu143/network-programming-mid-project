spring:
  application:
    name: zombies-server

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/zombies-game-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://zombies-auth.p3ntest.dev/oidc}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://zombies-auth.p3ntest.dev/oidc/jwks}

server:
  port: ${PORT:2567}
  compression:
    enabled: true

# Game configuration
game:
  max-rooms: 100
  tick-rate: 20
  room:
    max-clients: 6
    reconnection-timeout: 20000

# Assets service configuration
assets:
  service:
    url: ${ASSETS_SERVICE_URL:http://localhost:3000}
    token: ${ASSETS_SERVICE_TOKEN:}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.p3ntest.zombies: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

